[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# /index.html e / são o mesmo documento: 301 para a URL canônica (evita duplicata indexável)
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Cache longo para arquivos com hash (JS/CSS/fontes/imagens otimizadas)
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "SAMEORIGIN"
